<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задание — Pelegrina Math</title>
  <script>
    // Антикэш: версия ассетов = момент загрузки страницы (?v=…), чтобы свежие
    // стили и скрипты подхватывались сразу, без ручного сброса кэша браузера.
    window.__ASSET_V = Date.now();
    document.write('<link rel="stylesheet" href="css/style.css?v=' + window.__ASSET_V + '">');
  </script>
  <!-- MathJax для формул -->
  <script>
    window.MathJax = { tex: { inlineMath: [["$", "$"]] }, svg: { fontCache: "global" } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a href="index.html" class="logo back">← К заданиям</a>
    </div>
  </header>

  <main class="wrap">
    <h1 id="assignment-title">…</h1>
    <p id="assignment-deadline" class="deadline"></p>
    <p id="assignment-intro" class="intro"></p>
    <div id="assignment">Загрузка…</div>
  </main>

  <script>
    // Подключаем скрипты со свежей версией (?v=…) в том же порядке и синхронно,
    // как обычные теги (document.write при разборе страницы не ломает порядок).
    (function () {
      var v = window.__ASSET_V || Date.now();
      var files = ["js/config.js", "js/check.js", "js/stats.js", "js/app.js"];
      for (var i = 0; i < files.length; i++) {
        document.write('<script src="' + files[i] + '?v=' + v + '"><\/script>');
      }
    })();
  </script>
  <script>renderAssignment();</script>
</body>
</html>
